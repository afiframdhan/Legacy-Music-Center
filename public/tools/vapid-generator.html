<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Legacy VAPID Generator</title><style>body{font:15px system-ui;max-width:820px;margin:40px auto;padding:0 20px;color:#17232d}button{background:#f15a24;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700}textarea{width:100%;min-height:74px;margin:8px 0 18px;padding:10px;font-family:monospace}.note{background:#fff7f2;border:1px solid #fed7c5;padding:14px;border-radius:12px}</style></head><body><h1>Legacy VAPID Key Generator</h1><p class="note">Jalankan file ini secara lokal di komputer Anda. Jangan membagikan VAPID_PRIVATE_KEY. Public key boleh digunakan oleh aplikasi.</p><button onclick="generate()">Generate VAPID Keys</button><h3>VAPID_PUBLIC_KEY</h3><textarea id="pub" readonly></textarea><h3>VAPID_PRIVATE_KEY</h3><textarea id="priv" readonly></textarea><script>function b64u(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}function fromB64u(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const r=atob(s);return Uint8Array.from([...r].map(c=>c.charCodeAt(0)))}async function generate(){if(!crypto.subtle){alert('Web Crypto tidak tersedia. Buka file ini dengan Chrome/Safari terbaru.');return;}const pair=await crypto.subtle.generateKey({name:'ECDSA',namedCurve:'P-256'},true,['sign','verify']);const jwk=await crypto.subtle.exportKey('jwk',pair.privateKey);const x=fromB64u(jwk.x),y=fromB64u(jwk.y);const raw=new Uint8Array(65);raw[0]=4;raw.set(x,1);raw.set(y,33);document.getElementById('pub').value=b64u(raw);document.getElementById('priv').value=jwk.d;}</script></body></html>
